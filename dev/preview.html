<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div id="sticky-bar" class="sticky-bar" aria-hidden="true"><span id="sticky-time" class="sticky-time"></span><span id="sticky-next" class="sticky-next"></span></div>
    <header class="hero">
      <div class="hero-inner">
        <h1>Horde Warlock planner</h1>
        <p class="launch-line">WoW Forever launches <strong id="launch-label"></strong></p>
        <div id="countdown" class="countdown">
          <div class="unit"><span class="num" data-unit="days">--</span><span class="lbl">days</span></div>
          <div class="unit"><span class="num" data-unit="hours">--</span><span class="lbl">hours</span></div>
          <div class="unit"><span class="num" data-unit="minutes">--</span><span class="lbl">minutes</span></div>
          <div class="unit"><span class="num" data-unit="seconds">--</span><span class="lbl">seconds</span></div>
        </div>
        <p id="countdown-note" class="countdown-note"></p>
      </div>
    </header>
    <main>
      <section id="next-up" class="next-up"></section>
      <div id="tools" class="tools" hidden></div>
      <div id="phases" class="phases"></div>
    </main>
    <script type="module">
      import { getCountdown, formatZagreb, LAUNCH_MS } from '../js/countdown.js';
      import { validateCatalog } from '../js/catalog.js';
      import * as view from '../js/view.js';

      const params = new URLSearchParams(location.search);
      const owner = params.get('owner') === '1';
      const json = await (await fetch('../data/catalog.json')).json();
      const decisions = validateCatalog(json).decisions.map((d) => ({
        ...d, status: 'open', chosen: [], answer: '', reason: '',
      }));
      const get = (id) => decisions.find((d) => d.id === id);
      get('race').status = 'decided';
      get('race').chosen = ['orc'];
      get('race').reason = 'Blood Fury.';
      if (params.get('done') === '1') {
        get('pack').status = 'decided';
        get('pack').chosen = ['epic'];
        get('pack').reason = 'The extra 30 days of game time cover launch month.';
        get('names').status = 'decided';
        get('names').answer = 'Zargnak Dreadmaw, Zarg Embershade';
        get('names').reason = 'Short and easy to type.';
      }

      const expanded = new Set(params.get('open') ? params.get('open').split(',') : []);
      const foldedPhases = new Set(params.get('fold') ? params.get('fold').split(',') : []);
      const optionsShown = new Set(params.get('options') ? params.get('options').split(',') : []);
      const drafts = new Map();
      const errors = new Map();
      function render() {
        const ctx = {
          isOwner: owner, expanded, foldedPhases, optionsShown, drafts, errors, nowMs: Date.now(),
          onToggle(id) { expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(); },
          onDraft(id, patch, again) {
            const d = decisions.find((x) => x.id === id);
            const cur = drafts.get(id) || { status: d.status, chosen: d.chosen, answer: d.answer, reason: d.reason };
            drafts.set(id, { ...cur, ...patch });
            if (again) render();
          },
          onTogglePhase(id) { foldedPhases.has(id) ? foldedPhases.delete(id) : foldedPhases.add(id); render(); },
          onToggleOptions(id) { optionsShown.has(id) ? optionsShown.delete(id) : optionsShown.add(id); render(); },
          onSave() {},
        };
        view.renderNextUp(document.getElementById('next-up'), decisions, Date.now(), (id) => { expanded.add(id); render(); });
        view.renderTools(document.getElementById('tools'), { visible: true, onExpandAll() { decisions.forEach((d) => { expanded.add(d.id); optionsShown.add(d.id); }); foldedPhases.clear(); render(); }, onCollapseAll() { expanded.clear(); optionsShown.clear(); render(); } });
        view.renderPhases(document.getElementById('phases'), decisions, ctx);
        view.updateStickyNext(decisions, Date.now());
      }
      document.getElementById('launch-label').textContent = formatZagreb(LAUNCH_MS);
      view.updateCountdown(getCountdown(Date.now()));
      setInterval(() => view.updateCountdown(getCountdown(Date.now())), 1000);
      render();
      if (params.get('sticky') === '1') document.body.classList.add('show-sticky');
    </script>
  </body>
</html>
